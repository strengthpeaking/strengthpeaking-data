name: Sync StrengthPeaking JSON

on:
  schedule:
    - cron: "32 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download JSON
        run: |
          mkdir -p datasets

          curl \
            --location \
            --fail \
            --show-error \
            --retry 3 \
            --connect-timeout 20 \
            --max-time 120 \
            --user-agent "StrengthPeaking-Dataset-Sync/1.0 (+https://github.com/strengthpeaking/strengthpeaking-data)" \
            "https://strengthpeaking.com/openipf-raw-strength-averages.json" \
            -o datasets/openipf-raw-strength-averages.json

          test -s datasets/openipf-raw-strength-averages.json

          python -m json.tool \
            datasets/openipf-raw-strength-averages.json \
            > /dev/null

          echo "JSON downloaded and validated:"
          ls -lh datasets/openipf-raw-strength-averages.json

      - name: Commit JSON if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add datasets/openipf-raw-strength-averages.json

          if git diff --cached --quiet; then
            echo "JSON has not changed."
            exit 0
          fi

          git commit -m "Update raw strength averages JSON $(date -u +'%Y-%m-%d')"
          git push
