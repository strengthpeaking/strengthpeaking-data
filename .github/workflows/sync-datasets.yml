name: Sync StrengthPeaking datasets

on:
  schedule:
    - cron: "17 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download latest datasets
        shell: bash
        run: |
          set -e

          mkdir -p datasets

          download_file () {
            URL="$1"
            OUTPUT="$2"
            TEMP="${OUTPUT}.tmp"

            echo "================================"
            echo "Downloading:"
            echo "$URL"

            # Temporarily disable automatic exit so we can inspect curl's
            # actual exit code.
            set +e

            HTTP_CODE=$(curl \
              --location \
              --show-error \
              --retry 3 \
              --connect-timeout 20 \
              --max-time 120 \
              --user-agent "StrengthPeaking-Dataset-Sync/1.0 (+https://github.com/strengthpeaking/strengthpeaking-data)" \
              --header "Accept: */*" \
              --output "$TEMP" \
              --write-out "%{http_code}" \
              "$URL")

            CURL_EXIT=$?

            set -e

            echo
            echo "curl exit code: $CURL_EXIT"
            echo "HTTP status: $HTTP_CODE"

            if [ -f "$TEMP" ]; then
              echo "Downloaded size:"
              wc -c "$TEMP"
            fi

            if [ "$CURL_EXIT" -ne 0 ]; then
              echo "ERROR: curl failed with exit code $CURL_EXIT"
              exit 1
            fi

            case "$HTTP_CODE" in
              2*)
                echo "HTTP request successful."
                ;;
              *)
                echo "ERROR: Server returned HTTP $HTTP_CODE"
                echo "Response:"
                head -c 2000 "$TEMP" || true
                echo
                exit 1
                ;;
            esac

            if [ ! -s "$TEMP" ]; then
              echo "ERROR: Downloaded file is empty."
              exit 1
            fi

            mv "$TEMP" "$OUTPUT"

            echo "Saved:"
            ls -lh "$OUTPUT"
          }

          download_file \
            "https://strengthpeaking.com/openipf-raw-strength-averages.csv" \
            "datasets/openipf-raw-strength-averages.csv"

          download_file \
            "https://strengthpeaking.com/openipf-raw-strength-averages.json" \
            "datasets/openipf-raw-strength-averages.json"

      - name: Validate datasets
        run: |
          echo "Checking CSV..."
          test -s datasets/openipf-raw-strength-averages.csv
          head -n 3 datasets/openipf-raw-strength-averages.csv

          echo
          echo "Checking JSON..."
          test -s datasets/openipf-raw-strength-averages.json
          python -m json.tool \
            datasets/openipf-raw-strength-averages.json \
            > /dev/null

          echo "Both datasets are valid."

      - name: Commit changes if dataset changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add datasets/

          if git diff --cached --quiet; then
            echo "Datasets have not changed."
            exit 0
          fi

          git commit -m "Update StrengthPeaking datasets $(date -u +'%Y-%m-%d')"
          git push
