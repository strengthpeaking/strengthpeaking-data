name: Sync StrengthPeaking datasets

on:
  schedule:
    - cron: "17 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download latest datasets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p datasets

          download_file () {
            URL="$1"
            OUTPUT="$2"

            echo "Downloading: $URL"

            HTTP_CODE=$(curl \
              --location \
              --silent \
              --show-error \
              --compressed \
              --retry 3 \
              --connect-timeout 20 \
              --max-time 120 \
              --user-agent "Mozilla/5.0 (compatible; StrengthPeaking-Dataset-Sync/1.0; +https://github.com/strengthpeaking/strengthpeaking-data)" \
              --header "Accept: */*" \
              --output "${OUTPUT}.tmp" \
              --write-out "%{http_code}" \
              "$URL")

            echo "HTTP status: $HTTP_CODE"

            if [[ "$HTTP_CODE" != 2* ]]; then
              echo "Download failed."
              echo "Response body:"
              head -c 2000 "${OUTPUT}.tmp" || true
              echo
              exit 1
            fi

            if [[ ! -s "${OUTPUT}.tmp" ]]; then
              echo "Downloaded file is empty."
              exit 1
            fi

            mv "${OUTPUT}.tmp" "$OUTPUT"

            echo "Downloaded successfully:"
            ls -lh "$OUTPUT"
          }

          download_file \
            "https://strengthpeaking.com/openipf-raw-strength-averages.csv" \
            "datasets/openipf-raw-strength-averages.csv"

          download_file \
            "https://strengthpeaking.com/openipf-raw-strength-averages.json" \
            "datasets/openipf-raw-strength-averages.json"

      - name: Validate downloaded files
        run: |
          echo "CSV:"
          head -n 3 datasets/openipf-raw-strength-averages.csv

          echo
          echo "JSON:"
          python -m json.tool \
            datasets/openipf-raw-strength-averages.json \
            > /dev/null

          echo "JSON is valid."

      - name: Commit changes if dataset changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add datasets/

          if git diff --cached --quiet; then
            echo "No dataset changes."
            exit 0
          fi

          git commit -m "Update StrengthPeaking datasets $(date -u +'%Y-%m-%d')"
          git push
