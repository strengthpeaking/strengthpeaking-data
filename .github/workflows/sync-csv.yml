name: Sync StrengthPeaking CSV

on:
  schedule:
    - cron: "17 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-csv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download CSV
        run: |
          mkdir -p datasets

          curl \
            --location \
            --fail \
            --show-error \
            --retry 3 \
            --connect-timeout 20 \
            --max-time 120 \
            --user-agent "StrengthPeaking-Dataset-Sync/1.0 (+https://github.com/strengthpeaking/strengthpeaking-data)" \
            "https://strengthpeaking.com/openipf-raw-strength-averages.csv" \
            -o datasets/openipf-raw-strength-averages.csv

          test -s datasets/openipf-raw-strength-averages.csv

          echo "CSV downloaded:"
          ls -lh datasets/openipf-raw-strength-averages.csv

      - name: Commit CSV if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add datasets/openipf-raw-strength-averages.csv

          if git diff --cached --quiet; then
            echo "CSV has not changed."
            exit 0
          fi

          git commit -m "Update raw strength averages CSV $(date -u +'%Y-%m-%d')"
          git push
